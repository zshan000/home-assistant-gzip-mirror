name: Mirror Home Assistant image for legacy Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Home Assistant image tag to mirror (for example, 2026.8.0)
        required: true
        type: string
        default: "stable"

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ inputs.tag }}
      SOURCE_IMAGE: ghcr.io/home-assistant/home-assistant
      DESTINATION_IMAGE: ghcr.io/YOUR_GITHUB_USERNAME/home-assistant-gzip-mirror

    steps:
      # actions/checkout v4
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate image tag
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Image tag must satisfy Docker's tag syntax." >&2
            exit 1
          fi

      # actions/setup-go v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Mirror Linux amd64 image for legacy Docker
        shell: bash
        run: |
          set -euo pipefail

          go run ./cmd/mirror \
            "${SOURCE_IMAGE}:${IMAGE_TAG}" \
            "${DESTINATION_IMAGE}:${IMAGE_TAG}"
